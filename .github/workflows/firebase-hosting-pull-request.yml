name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci && npm run build
      - run: cd functions && npm ci
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GITHUB_DASHBOARD_642CB }}
          projectId: github-dashboard-642cb
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      - name: Deploy Functions (Preview)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GITHUB_DASHBOARD_642CB }}' > /tmp/firebase-key.json
          npx firebase-tools deploy --only functions --project github-dashboard-642cb --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
